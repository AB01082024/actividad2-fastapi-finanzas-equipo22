[project]
name = "actividad2-fastapi-finanzas-equipo22"
version = "0.1.0"
description = "API financiera educativa con FastAPI, yfinance y Docker"
authors = [
    {name = "Angelica Becerra",email = "ft.angelicabecerraforero@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.140.0,<0.141.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "yfinance (>=1.5.2,<2.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
